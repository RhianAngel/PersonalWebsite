<!DOCTYPE html>
<html>
<head>
<title>Live Character Counter</title>
<style>

	 body {
        font-family: Arial, sans-serif;
        background-color: #FFDCDC;
        margin: 0;
        padding: 40px;
        color: #4F252E;
    }

    .container {
        max-width: 700px;
        margin: 0 auto;
    }

    h1 {
        text-align: center;
        margin-bottom: 30px;
    }

    label {
        font-weight: bold;
        display: block;
        margin-bottom: 8px;
    }

    textarea {
        width: 100%;
        height: 180px;
        padding: 12px;
        font-size: 15px;
        font-family: monospace;
        border: 2px solid #D8A2A2;
        border-radius: 4px;
        resize: vertical;
        box-sizing: border-box;
    }

    #char-count {
        text-align: right;
        margin-top: 6px;
        color: #4F252E;
    }

    #char-count.limit-reached {
        color: #BA5A5A;
        font-weight: bold;
    }

    .preview-box h3 {
        margin-top: 30px;
        margin-bottom: 10px;
    }

    #live-preview {
        min-height: 30px;
        padding: 10px;
        border: 2px dashed #D8A2A2;
        border-radius: 4px;
        background-color: #FFF9D6;
        overflow-wrap: break-word;
    }

    .counts-wrapper {
        display: flex;
        gap: 30px;
        margin-top: 15px;
        flex-wrap: wrap;
    }

    .counts-box {
        flex: 1;
        min-width: 250px;
        border: 2px solid #D8A2A2;
        border-radius: 4px;
        padding: 12px;
        background-color: #FFF9D6;
    }

    .counts-box h3 {
        margin-top: 0;
        margin-bottom: 10px;
        font-size: 15px;
    }

    .counts-grid {
        display: grid;
        gap: 6px;
        font-family: monospace;
        font-size: 15px;
    }
</style>
</head>
<body>

    <div class="container">
        <h1>Live Character Counter</h1>
        <label for="text-input">
            Enter your message:
        </label>

        <textarea
            id="text-input"
            maxlength="150"
            placeholder="Type something here..."
        ></textarea>

        <p id="char-count">0 / 150</p>

        <div class="preview-box">
            <h3>Live Preview</h3>
            <p id="live-preview">
                (Preview text will appear here)
            </p>
        </div>

        <div class="counts-wrapper">
            <div class="counts-box">
                <h3>Digits 1-5 Count</h3>
                <div class="counts-grid" id="digit-counts"></div>
            </div>
            <div class="counts-box">
                <h3>Letters a-z Count</h3>
                <div class="counts-grid" id="letter-counts"></div>
            </div>
        </div>
    </div>

    <script>


        const input = document.querySelector('#text-input');
        const charCount = document.querySelector('#char-count');
        const preview = document.querySelector('#live-preview');
        const digitCounts = document.querySelector('#digit-counts');
        const letterCounts = document.querySelector('#letter-counts');


        input.addEventListener('input', (e) => {


            const value = e.target.value;


            charCount.textContent = `${value.length} / 150`;
            charCount.classList.toggle('limit-reached', value.length >= 150);


            preview.textContent =
                value || '(Preview text will appear here)';


            digitCounts.innerHTML = '';
            for (let d = 1; d <= 5; d++) {
                const count = value.split(String(d)).length - 1;
                const div = document.createElement('div');
                div.textContent = `${d} - ${count}`;
                digitCounts.appendChild(div);
            }


            letterCounts.innerHTML = '';
            const lowerValue = value.toLowerCase();
            for (let code = 97; code <= 122; code++) {
                const letter = String.fromCharCode(code);
                const count = lowerValue.split(letter).length - 1;
                const div = document.createElement('div');
                div.textContent = `${letter} - ${count}`;
                letterCounts.appendChild(div);
            }
        });

    </script>

</body>
</html>
